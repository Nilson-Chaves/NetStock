version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: netstock-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin123password
      POSTGRES_DB: netstock_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./server
    container_name: netstock-api
    restart: always
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DATABASE_URL: "postgresql://postgres:admin123password@postgres:5432/netstock_db?schema=public"
      JWT_SECRET: "netstock_super_secreto_jwt_key_2026_@key"
      JWT_EXPIRES_IN: "1d"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: