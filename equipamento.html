<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gerenciar Equipamento | NetStock</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Estilização Padrão NetStock */
    .form-grid-netstock {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
      margin-top: 16px;
    }

    .form-group-netstock {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group-netstock label {
      font-size: 0.82rem;
      font-weight: 600;
      color: #64748b;
      letter-spacing: 0.02em;
    }

    .form-group-netstock input,
    .form-group-netstock select {
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      background-color: #ffffff;
      color: #0f172a;
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    /* Estilo para campos bloqueados/apenas leitura */
    .form-group-netstock input[readonly],
    .form-group-netstock select[disabled] {
      background-color: #f1f5f9;
      color: #64748b;
      border-color: #e2e8f0;
      cursor: not-allowed;
      opacity: 0.9;
    }

    /* Destaque especial apenas para o campo de Localização (Editável) */
    .form-group-netstock input#eq-localizacao {
      border: 2px solid #0284c7;
      background-color: #ffffff;
    }

    .form-group-netstock input#eq-localizacao:focus {
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.2);
    }

    .selector-banner {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #ffffff;
      padding: 18px 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .selector-banner label {
      display: block;
      font-size: 0.85rem;
      color: #38bdf8;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .selector-banner select {
      width: 100%;
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background-color: #0f172a;
      color: #ffffff;
      font-size: 0.95rem;
      font-family: inherit;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="index.html">
        <img src="logo.svg" alt="Logo NetStock">
        <span><strong>NetStock</strong><small>inventário de rede</small></span>
      </a>
      <div class="nav-label">Workspace</div>
      <nav class="nav" aria-label="Navegação principal">
        <a href="index.html"><span class="icon">◈</span>Dashboard</a>
        <a href="inventario.html"><span class="icon">▦</span>Inventário & Patrimônio</a>
        <a class="active" href="equipamento.html"><span class="icon">⌁</span>Equipamento</a>
        <a href="manutencao.html"><span class="icon">◷</span>Manutenção</a>
        <a href="descarte.html"><span class="icon">♻</span>Descarte / Reuso</a>
      </nav>
      <p class="sidebar-note">Visibilidade clara para cada ativo conectado à sua operação.</p>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <div class="eyebrow">CADASTRO E EDIÇÃO</div>
          <h1>Gerenciar Equipamento</h1>
          <p class="subtitle">Selecione o ativo para consultar dados ou alterar sua alocação de sala.</p>
        </div>
        <div class="user-chip">
          <!-- Preenchido via JS com os dados do usuário autenticado -->
        </div>
      </header>

      <section class="panel panel-padded">
        
        <!-- Seletor de Equipamentos -->
        <div class="selector-banner">
          <label for="select-equipamento-carregar">🔍 Selecionar Equipamento Cadastrado para Alocação/Consulta:</label>
          <select id="select-equipamento-carregar">
            <option value="">-- Escolha um equipamento para carregar os dados --</option>
          </select>
        </div>

        <form id="form-gerenciar-equipamento">
          <input type="hidden" id="eq-id">

          <div class="form-grid-netstock">
            <div class="form-group-netstock">
              <label for="eq-nome">Nome do Equipamento</label>
              <input type="text" id="eq-nome" readonly placeholder="Carregue um equipamento">
            </div>

            <div class="form-group-netstock">
              <label for="eq-patrimonio">Código Patrimonial</label>
              <input type="text" id="eq-patrimonio" readonly placeholder="Carregue um equipamento">
            </div>

            <div class="form-group-netstock">
              <label for="eq-tipo">Tipo / Categoria</label>
              <select id="eq-tipo" disabled>
                <option value="">Selecione...</option>
                <option value="Switch">Switch</option>
                <option value="Roteador">Roteador</option>
                <option value="Firewall">Firewall</option>
                <option value="Servidor">Servidor</option>
                <option value="Access Point">Access Point</option>
                <option value="Cabo / Acessório">Cabo / Acessório</option>
                <option value="Outros">Outros</option>
              </select>
            </div>

            <!-- APENAS ESTE CAMPO É EDITÁVEL -->
            <div class="form-group-netstock">
              <label for="eq-localizacao" style="color: #0284c7;">Sala / Localização Atual * (Editável)</label>
              <input type="text" id="eq-localizacao" required placeholder="Ex: Rack A - Sala de Servidores">
            </div>

            <div class="form-group-netstock">
              <label for="eq-responsavel">Responsável Técnico</label>
              <input type="text" id="eq-responsavel" readonly placeholder="Carregue um equipamento">
            </div>

            <div class="form-group-netstock">
              <label for="eq-valor">Valor Estimado (R$)</label>
              <input type="text" id="eq-valor" readonly placeholder="R$ 0,00">
            </div>

            <div class="form-group-netstock">
              <label for="eq-status">Status Operacional</label>
              <select id="eq-status" disabled>
                <option value="Ativo">Ativo</option>
                <option value="Em Manutenção">Em Manutenção</option>
                <option value="Obsoleto">Obsoleto</option>
                <option value="Descartado">Descartado</option>
                <option value="Reaproveitado">Reaproveitado</option>
              </select>
            </div>
          </div>

          <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px; padding-top: 16px; border-top: 1px solid #e2e8f0;">
            <button type="button" class="btn-secondary" onclick="limparFormulario()">Limpar</button>
            <button type="submit" class="btn-primary" id="btn-salvar-eq">Salvar Nova Localização</button>
          </div>
        </form>
      </section>
    </main>
  </div>

  <script src="js/api.js"></script>

  <script>
    let equipamentosCadastrados = [];

    document.addEventListener('DOMContentLoaded', async () => {
      if (typeof atualizarUserChip === 'function') atualizarUserChip();
      await carregarDropdownEquipamentos();
    });

    async function carregarDropdownEquipamentos() {
      try {
        equipamentosCadastrados = await obterTodosEquipamentos();
        const selectElement = document.getElementById('select-equipamento-carregar');
        
        selectElement.innerHTML = '<option value="">-- Escolha um equipamento para carregar os dados --</option>';

        if (Array.isArray(equipamentosCadastrados) && equipamentosCadastrados.length > 0) {
          equipamentosCadastrados.forEach(eq => {
            const opt = document.createElement('option');
            opt.value = eq.id;
            opt.textContent = `${eq.numPatrimonio || eq.codigo || 'PAT'} - ${eq.nome} (${eq.localizacao || 'Sem local'})`;
            selectElement.appendChild(opt);
          });
        }
      } catch (err) {
        console.error('Erro ao carregar lista de equipamentos:', err);
      }
    }

    // Carrega os dados bloqueando todos os campos exceto Localização
    document.getElementById('select-equipamento-carregar').addEventListener('change', (e) => {
      const eqId = e.target.value;
      if (!eqId) {
        limparFormulario();
        return;
      }

      const eq = equipamentosCadastrados.find(item => String(item.id) === String(eqId));
      if (eq) {
        document.getElementById('eq-id').value = eq.id;
        document.getElementById('eq-nome').value = eq.nome || '';
        document.getElementById('eq-patrimonio').value = eq.numPatrimonio || eq.codigo || '';
        document.getElementById('eq-tipo').value = eq.tipo || '';
        document.getElementById('eq-localizacao').value = eq.localizacao || '';
        document.getElementById('eq-responsavel').value = eq.responsavel || '';
        document.getElementById('eq-valor').value = `R$ ${(Number(eq.precoVenda) || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2 })}`;
        document.getElementById('eq-status').value = eq.status || 'Ativo';
      }
    });

    function limparFormulario() {
      document.getElementById('eq-id').value = '';
      document.getElementById('select-equipamento-carregar').value = '';
      document.getElementById('form-gerenciar-equipamento').reset();
    }

    // Atualiza estritamente a localização no servidor
    document.getElementById('form-gerenciar-equipamento').addEventListener('submit', async (e) => {
      e.preventDefault();

      const eqId = document.getElementById('eq-id').value;
      const novaLocalizacao = document.getElementById('eq-localizacao').value.trim();

      if (!eqId) {
        alert('⚠️ Selecione um equipamento na lista acima para alterar a localização.');
        return;
      }

      if (!novaLocalizacao) {
        alert('⚠️ Informe a nova sala / localização.');
        return;
      }

      try {
        const token = localStorage.getItem('netstock_token') || '';

        const res = await fetch(`${API_BASE_URL}/equipamentos/${eqId}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            ...(token ? { 'Authorization': `Bearer ${token}` } : {})
          },
          body: JSON.stringify({ localizacao: novaLocalizacao })
        });

        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(errData.error || errData.message || 'Erro ao atualizar a localização.');
        }

        alert('✅ Localização/Sala atualizada com sucesso no banco de dados e inventário!');
        limparFormulario();
        await carregarDropdownEquipamentos();
      } catch (err) {
        alert('❌ Erro: ' + err.message);
      }
    });
  </script>
</body>
</html>
